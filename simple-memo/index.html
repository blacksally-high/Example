<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단 메모장</title>
<style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:600px;background:#fff;color:#222;font:16px system-ui}section,li{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;max-width:100%}input,textarea{display:block;width:100%;margin:10px 0}button{cursor:pointer;margin:4px}button:disabled{cursor:wait}ul{padding:0;list-style:none}p{overflow-wrap:anywhere}li p{white-space:pre-wrap}#status{min-height:24px}[hidden]{display:none!important}</style>
<h1>간단 메모장</h1><p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden><form id="credentials"><label>이메일<input id="email" type="email" autocomplete="email" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button type="submit">로그인</button><button type="button" id="signup">회원가입</button></form></section>
<section id="app" hidden><p id="who"></p><button id="logout">로그아웃</button><form id="memoForm"><label>메모 내용<textarea id="content" rows="5" required></textarea></label><button type="submit">저장</button></form><ul id="list"></ul></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
const db=window.supabase?.createClient('https://nslhhczdyfqlwhxqsplw.supabase.co','sb_publishable_CBay8841IkC2R6gECR4Ttw_XOozQW4V',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let user=null,busy=false,version=0;
function status(text){$('status').textContent=text}
async function run(label,action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);status(label);try{await action()}catch(e){status('오류: '+e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const current=user?.id,v=version;if(!current)return;const {data,error}=await db.from('memos').select('id,content,created_at').eq('user_id',current).order('created_at',{ascending:false});if(error)throw error;if(v!==version)return;$('list').replaceChildren();for(const memo of data){const li=document.createElement('li'),p=document.createElement('p'),button=document.createElement('button');p.textContent=memo.content;button.textContent='삭제';button.onclick=()=>run('삭제 중…',async()=>{const {data,error}=await db.from('memos').delete().eq('id',memo.id).eq('user_id',user.id).select('id');if(error)throw error;if(!data.length)throw Error('삭제할 메모를 찾을 수 없습니다.');await load();status('삭제했습니다.')});li.append(p,button);$('list').append(li)}if(!data.length){const li=document.createElement('li');li.textContent='저장된 메모가 없습니다.';$('list').append(li)}}
async function render(session){version++;user=session?.user??null;$('auth').hidden=!!user;$('app').hidden=!user;$('list').replaceChildren();$('who').textContent=user?.email??'';if(user)await load()}
async function authenticate(signup){if(!$('credentials').reportValidity())return;await run('처리 중…',async()=>{const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await db.auth.signUp(credentials):await db.auth.signInWithPassword(credentials);if(error)throw error;$('password').value='';await render(data.session);status(data.session?'로그인했습니다.':'가입되었습니다. 이메일 확인 설정을 확인해 주세요.')})}
$('credentials').onsubmit=e=>{e.preventDefault();authenticate(false)};
$('signup').onclick=()=>authenticate(true);
$('memoForm').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){status('메모 내용을 입력해 주세요.');return}run('저장 중…',async()=>{if(!user)throw Error('로그인이 필요합니다.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await load();status('저장했습니다.')})};
$('logout').onclick=()=>run('로그아웃 중…',async()=>{const {error}=await db.auth.signOut();if(error)throw error;await render(null);$('content').value='';status('로그아웃했습니다.')});
if(!db){status('오류: 연결 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.')}else{db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){version++;user=null;$('app').hidden=true;$('auth').hidden=false;$('list').replaceChildren()}else if(event==='SIGNED_IN'&&session?.user.id!==user?.id){setTimeout(()=>render(session).catch(e=>status('오류: '+e.message)),0)}});db.auth.getSession().then(async({data,error})=>{if(error)throw error;await render(data.session);status('')}).catch(e=>status('오류: '+e.message))}
</script></html>
