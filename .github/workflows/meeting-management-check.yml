name: Meeting management check

on:
  push:
    branches: [main]
    paths:
      - 'meeting-management-system/**'
      - '.github/workflows/meeting-management-check.yml'
  pull_request:
    paths:
      - 'meeting-management-system/**'
      - '.github/workflows/meeting-management-check.yml'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check

